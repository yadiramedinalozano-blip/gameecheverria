<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Colapso Sur — Diálogo 3</title>
  <link rel="icon" type="image/png" href="imagenes/icono.png">
  <link rel="stylesheet" href="style.css"/>

  <style>
    /* ESTILOS GENERALES Y DE FONDO */
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      color: var(--text, #fff);
      background: #000 url('imagenes/enfermedad.png') no-repeat center center fixed;
      background-size: cover;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      text-align: center;
    }

    /* 📸 ENCABEZADO FIJO DEL PERSONAJE (Personaje3.png) */
    /* Este DIV fijo reemplaza a la etiqueta IMG */
    .personaje-header {
      position: fixed; /* Lo mantiene en su lugar */
      top: 0;
      left: 0;
      width: 100%;
      height: 60vh; /* Altura que ocupará el personaje */
      
      /* CLAVE: Configuración del Personaje 3 como imagen de fondo */
      background: 
        linear-gradient(to top, rgba(0,0,0,0.5), transparent 50%),
        url('imagenes/personaje3.png') no-repeat center bottom; 
      
      background-size: contain; 
      background-repeat: no-repeat;
      background-position: center bottom;
      background-color: #000; 
      z-index: 5; 
      border-bottom: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    
    /* Nota: Se eliminó la regla .personaje que apuntaba al IMG */

    /* CONTENEDOR DE OPCIONES/DIÁLOGO */
    .dialogo {
      position: relative;
      /* CLAVE: Empieza justo debajo del encabezado (60vh) */
      margin-top: 60vh; 
      padding: 2rem 1rem;
      background: rgba(0, 0, 0, 0.6);
      border-top: 1px solid rgba(255,255,255,0.15);
      width: 100%;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      border-radius: 12px 12px 0 0;
      z-index: 10; /* Asegura que el diálogo esté encima del personaje */
    }

    .opcion {
      display: block;
      width: 100%;
      margin: 0.8rem 0;
      padding: 1rem;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #111;
      background: linear-gradient(135deg, #ffd76f, #ff9f8b);
    }
    .opcion:hover {
      background: linear-gradient(135deg, #ffe69f, #ffb07b);
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(255,200,120,0.5);
    }
  </style>
</head>

<body>
  <div class="personaje-header"></div> 

  <div class="dialogo">
    <button class="opcion" data-ethos="realista" data-next="dialogo4.html">
      Tienes un mapa y medicina. Eso me basta. Pero si mientes, te dejo en el siguiente desvío.
    </button>

    <button class="opcion" data-ethos="romantico" data-next="dialogo4.html">
      Caminar contigo… suena menos triste que hacerlo solo.  
      Quizás la medicina y el mapa no sean lo que más cura.
    </button>

    <button class="opcion" data-ethos="clasico" data-next="dialogo4.html">
      Si compartes el camino, compartes la responsabilidad.  
      Te haré caso con la ruta, pero las decisiones las tomamos entre los dos.
    </button>

    <button class="opcion" data-ethos="barroco" data-next="dialogo4.html">
      Un mapa, medicina y encanto… eso suena a trampa o a milagro.  
      Pero si vas a mentirme, hazlo bien. Vamos, me gusta el peligro con estilo.
    </button>
  </div>

  <script src="js/game.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      document.querySelectorAll('.opcion').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const ethos = btn.dataset.ethos;
          const next = btn.dataset.next || 'dialogo4.html';
          addPoint(ethos, 1);
          window.location.href = next;
        });
      });
    });
  </script>
</body>
</html>
