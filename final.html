<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Final — Colapso sur</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .wrap{max-width:900px;margin:0 auto;text-align:left}
    .final-box{
      background:rgba(20,20,25,.55);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      padding:1.2rem;
      margin-top:1rem;
      text-align:center;
    }

    .final-img{
      display:block;
      width:100%;
      max-width:800px;
      margin:0 auto 1.5rem auto;
      border-radius:12px;
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 0 12px rgba(0,0,0,0.5);
    }

    .scores{margin-top:.8rem;color:var(--muted)}
    .actions{margin-top:1.5rem;display:flex;gap:.8rem;flex-wrap:wrap;justify-content:center}
    .btn{
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      color:#111;
      border:none;
      border-radius:8px;
      padding:.6rem 1.2rem;
      font-weight:700;
      cursor:pointer;
      transition:all .25s ease;
    }
    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 0 10px rgba(0,0,0,.3);
    }
  </style>
</head>
<body>
  <div class="container wrap">
    <header>
      <h1>Epílogo</h1>
      <p class="subtitle">El mundo te respondió según tus pasos.</p>
    </header>

    <section class="final-box">
      <img id="final-image" class="final-img" alt="Final del juego" src="">
      <h2 id="final-title">Final</h2>
      <p id="final-text"></p>
      <div class="scores" id="score-breakdown"></div>
      <div class="actions">
        <button class="btn" id="replay">Jugar otra vez</button>
        <button class="btn" id="home">Volver al inicio</button>
      </div>
    </section>
  </div>

  <script src="js/game.js"></script>
  <script>
    const { ganador, empate, ranking } = computeWinner();

    const titles = {
      clasico:  "Final clásico — Reconoce la contradicción capitalista y busca equilibrar la tensión",
      romantico:"Final romántico — Busca escapar de la realidad, idealizando lo que podría ser",
      realista: "Final realista — Acepta la realidad capitalista sin cuestionarla",
      barroco:  "Final barroco — Vive la contradicción de la vida moderna de manera estilizada"
    };

    const texts = {
      clasico: `Tu visión del mundo se inclinó hacia el ethos clásico.
       Elegiste la medida, la prudencia y el equilibrio.
       Encontraste armonía entre el deber y el deseo. `,
      romantico: `Tu visión del mundo se inclinó hacia el ethos romántico.
         Buscaste sentido en medio del caos. 
         Convertiste la esperanza en tu fuerza.`,
      realista: `Tu visión del mundo se inclinó hacia el ethos realista.
        Hallaste refugio en el orden y en la eficacia.
        Sobrevivir fue tu forma de creer.`,
      barroco: `Tu visión del mundo se inclinó hacia el ethos barroco.
        Hiciste del disimulo y la mezcla tu refugio. 
        Sobreviviste riendo entre las ruinas.`
    };

    const images = {
      clasico:  "imagenes/finalclasico.png",
      romantico:"imagenes/finalromantico.png",
      realista: "imagenes/finalrealista.png",
      barroco:  "imagenes/finalbarroco.png"
    };

    // Rellenar UI
    document.getElementById('final-title').textContent = titles[ganador];
    document.getElementById('final-text').textContent  = texts[ganador];
    document.getElementById('final-image').src = images[ganador];

    // Mostrar desglose de puntajes
    const s = getScores();
    const br = document.getElementById('score-breakdown');
    br.innerHTML = `
      <strong>Puntajes</strong> — Clásico: ${s.clasico} · Romántico: ${s.romantico}
      · Realista: ${s.realista} · Barroco: ${s.barroco}
      ${empate ? '<br><em>(Hubo empate; se decidió por tu última elección.)</em>' : ''}
    `;

    // Botones
    document.getElementById('replay').addEventListener('click', ()=>{
      resetScores();
      window.location.href = 'index.html';
    });
    document.getElementById('home').addEventListener('click', ()=>{
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
