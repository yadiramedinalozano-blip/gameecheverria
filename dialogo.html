<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Colapso Sur — Diálogo 2</title>
  <link rel="icon" type="image/png" href="imagenes/icono.png">
  <link rel="stylesheet" href="style.css"/>

  <style>
    /* ESTILOS GENERALES Y DE FONDO */
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      color: var(--text, #fff);
      background: #000 url('imagenes/enfermedad.png') no-repeat center center fixed;
      background-size: cover;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      text-align: center;
    }

    /* 📸 ENCABEZADO FIJO DEL PERSONAJE (Personaje2.png) */
    .personaje-header {
      position: fixed; /* Lo mantiene en su lugar al hacer scroll */
      top: 0;
      left: 0;
      width: 100%;
      height: 65vh; /* Altura que ocupará el personaje en la pantalla */
      
      /* Configuración del Personaje 2 como imagen de fondo */
      background: 
        linear-gradient(to top, rgba(0,0,0,0.5), transparent 50%), /* Degradado sutil para integrar el diálogo */
        url('imagenes/personaje2.png') no-repeat center bottom; 
      
      background-size: contain; /* Asegura que el personaje se vea completo */
      background-repeat: no-repeat;
      background-position: center bottom; /* Centra la imagen y la pega abajo del header */
      background-color: #000; 
      z-index: 5; /* Asegura que el personaje esté detrás del diálogo */
      border-bottom: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    
    /* Nota: Se eliminó la regla .personaje que causaba conflicto */

    /* CONTENEDOR DE OPCIONES/DIÁLOGO */
    .dialogo {
      position: relative;
      /* CLAVE: Empieza justo debajo del .personaje-header (65vh) */
      margin-top: 65vh; 
      padding: 2rem 1rem;
      background: rgba(0, 0, 0, 0.6);
      border-top: 1px solid rgba(255,255,255,0.15);
      width: 100%;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      border-radius: 12px 12px 0 0;
      z-index: 10; /* Asegura que el diálogo se vea encima del fondo/personaje */
    }

    .opcion {
      display: block;
      width: 100%;
      margin: 0.8rem 0;
      padding: 1rem;
      font-size: 1.3rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #111;
      background: linear-gradient(135deg, #ffd76f, #ff9f8b);
    }
    .opcion:hover {
      background: linear-gradient(135deg, #ffe69f, #ffb07b);
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(255,200,120,0.5);
    }
  </style>
</head>

<body>
  <div class="personaje-header"></div> 

  <div class="dialogo">
    <button class="opcion" id="continuar">...</button>
  </div>

  <script>
    document.getElementById('continuar').addEventListener('click', ()=>{
      // Cuando el jugador hace clic, pasa a la siguiente página:
      window.location.href = 'dialogo3.html';
    });
  </script>
</body>
</html>
