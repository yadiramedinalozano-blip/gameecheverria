<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Colapso Sur — Diálogo</title>
  <link rel="icon" type="image/png" href="imagenes/icono.png">
  <link rel="stylesheet" href="style.css"/>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      color: var(--text, #fff);
      background: #000 url('imagenes/enfermedad.png') no-repeat center center fixed;
      background-size: cover;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      text-align: center;
    }

    .personaje {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 700px;
      height: auto;
      z-index: 5;
    }

    .dialogo {
      position: relative;
      margin-top: 65vh;
      padding: 2rem 1rem;
      background: rgba(0, 0, 0, 0.6);
      border-top: 1px solid rgba(255,255,255,0.15);
      width: 100%;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      border-radius: 12px 12px 0 0;
    }

    .opcion {
      display: block;
      width: 100%;
      margin: 0.8rem 0;
      padding: 1rem;
      font-size: 1.3rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      color: #111;
      background: linear-gradient(135deg, #ffd76f, #ff9f8b);
    }
    .opcion:hover {
      background: linear-gradient(135deg, #ffe69f, #ffb07b);
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(255,200,120,0.5);
    }
  </style>
</head>

<body>
  <!-- Imagen del personaje -->
  <img src="imagenes/personaje2.png" alt="Personaje del diálogo" class="personaje">

  <!-- Cuadro del diálogo -->
  <div class="dialogo">
    <button class="opcion" id="continuar">...</button>
  </div>

  <script>
    document.getElementById('continuar').addEventListener('click', ()=>{
      // Aquí puedes poner la siguiente escena, por ejemplo:
      // window.location.href = 'riobamba.html';
      console.log("Continuar al siguiente diálogo...");
    });
  </script>
</body>
</html>
