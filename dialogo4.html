<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Colapso Sur — Diálogo 4</title>
  <link rel="icon" type="image/png" href="imagenes/icono.png">
  <link rel="stylesheet" href="style.css"/>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      color: var(--text, #fff);
      background: #000 url('imagenes/enfermedad.png') no-repeat center center fixed;
      background-size: cover;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      text-align: center;
    }

    .personaje {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 700px;
      height: auto;
      z-index: 5;
    }

    .dialogo {
      position: relative;
      margin-top: 60vh;
      padding: 2rem 1rem;
      background: rgba(0, 0, 0, 0.6);
      border-top: 1px solid rgba(255,255,255,0.15);
      width: 100%;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      border-radius: 12px 12px 0 0;
    }

    .dialogo p {
      margin-bottom: 1.5rem;
      font-size: 1.2rem;
      color: #eee;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .opciones {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 1.5rem;
      justify-items: center;
    }

    .opcion-img {
      background: none;
      border: none;
      cursor: pointer;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .opcion-img img {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    .opcion-img:hover {
      transform: scale(1.08);
      filter: brightness(1.2);
    }
  </style>
</head>

<body>
  <!-- Imagen del personaje -->
  <img src="imagenes/personaje4.png" alt="Personaje del diálogo" class="personaje">

  <!-- Cuadro del diálogo -->
  <div class="dialogo">
    <p>Elige tu vestimenta</p>

    <div class="opciones">
      <button class="opcion-img" data-ethos="realista">
        <img src="imagenes/realista.png" alt="Camino realista">
      </button>

      <button class="opcion-img" data-ethos="romantico">
        <img src="imagenes/romantico.png" alt="Camino romántico">
      </button>

      <button class="opcion-img" data-ethos="barroco">
        <img src="imagenes/barroco.png" alt="Camino barroco">
      </button>

      <button class="opcion-img" data-ethos="clasico">
        <img src="imagenes/clasico.png" alt="Camino clásico">
      </button>
    </div>
  </div>

  <script src="js/game.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', ()=>{
      document.querySelectorAll('.opcion-img').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const ethos = btn.dataset.ethos;
          addPoint(ethos, 1);
          // Redirige ahora a pre_final.html
          window.location.href = 'pre_final.html';
        });
      });
    });
  </script>
</body>
</html>
