<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Colapso Sur — Diálogo 5</title>
  <link rel="icon" type="image/png" href="imagenes/icono.png">
  <link rel="stylesheet" href="style.css"/>

  <style>
    /* ESTILOS GENERALES Y DE FONDO */
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      color: var(--text, #fff);
      background: #000 url('imagenes/enfermedad.png') no-repeat center center fixed;
      background-size: cover;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* Cambiado a flex-start para respetar el margin-top */
      min-height: 100vh;
      text-align: center;
    }

    /* 📸 ENCABEZADO FIJO DEL PERSONAJE (Personaje5.png) */
    /* Reemplaza la antigua regla .personaje. Usamos un DIV como contenedor fijo. */
    .personaje-header {
      position: fixed; /* Lo mantiene en su lugar */
      top: 0;
      left: 0;
      width: 100%;
      height: 60vh; /* CLAVE: Altura que ocupará el personaje */
      
      /* Configuración del Personaje 5 como imagen de fondo */
      background: 
        linear-gradient(to top, rgba(0,0,0,0.5), transparent 50%),
        url('imagenes/personaje5.png') no-repeat center bottom; /* <--- IMAGEN 5 */
      
      background-size: contain; 
      background-repeat: no-repeat;
      background-position: center bottom;
      background-color: #000; 
      z-index: 5; 
      border-bottom: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    
    /* Nota: Se eliminó la regla .personaje que apuntaba al IMG */

    /* CONTENEDOR DE OPCIONES/DIÁLOGO */
    .contenido {
      position: relative;
      /* CLAVE: Empieza justo debajo del encabezado (60vh) */
      margin-top: 60vh; 
      background: rgba(0, 0, 0, 0.6);
      border-top: 1px solid rgba(255,255,255,0.15);
      padding: 2rem 1rem 3rem;
      width: 100%;
      max-width: 800px;
      border-radius: 12px 12px 0 0;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      z-index: 10; /* Asegura que el contenido esté encima del personaje */
    }

    h2 {
      font-size: 1.6rem;
      margin-bottom: 1.8rem;
      color: #fff;
      letter-spacing: 0.5px;
    }

    button {
      background: linear-gradient(135deg, #ffd76f, #ff9f8b);
      border: none;
      border-radius: 10px;
      padding: 1rem 2rem;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      color: #111;
      transition: all 0.3s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #ffe69f, #ffb07b);
      transform: translateY(-3px);
      box-shadow: 0 0 15px rgba(255,200,120,0.5);
    }
  </style>
</head>

<body>
  <div class="personaje-header"></div> 

  <div class="contenido">
    <h2>¿Estás listo para iniciar tu aventura?</h2>
    <button id="iniciar">Sí</button>
  </div>

  <script>
    document.getElementById('iniciar').addEventListener('click', ()=>{
      window.location.href = 'pre_final.html';
    });
  </script>
</body>
</html>
